<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d1230">
<title>Admin · {{name}}</title>
<style>
@font-face { font-family: "CT Sans"; src: url(/fonts/Poppins-Regular.ttf); font-display: swap; }
@font-face { font-family: "CT Sans Semi"; src: url(/fonts/Poppins-SemiBold.ttf); font-display: swap; }
@font-face { font-family: "CT Sans Bold"; src: url(/fonts/Poppins-Bold.ttf); font-display: swap; }
@font-face { font-family: "CT Serif"; src: url(/fonts/DMSerifDisplay-Regular.ttf); font-display: swap; }
@font-face { font-family: "CT Lobster"; src: url(/fonts/Lobster-Regular.ttf); font-display: swap; }
:root { --night: #1d1230; --deep: #150c24; --panel: #271938; --panel2: #302043; --line: #43305c; --cream: #fff8ee; --text: #efe6f6; --dim: #b9a9c9; --gold: #f2b632; --berry: #c2185b; --coral: #ff6b5e; --leaf: #3fbf8f; --bad: #ff8f85; --semi: "CT Sans Semi", system-ui, sans-serif; --bold: "CT Sans Bold", system-ui, sans-serif; }
* { box-sizing: border-box; }
html { background: var(--night); }
body { margin: 0; min-height: 100vh; background: var(--night); color: var(--text); font: 14px/1.45 "CT Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--gold); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; font-weight: 400; }
.brand { display: inline-flex; align-items: center; gap: 8px; color: var(--cream); } .brand svg { width: 28px; height: 28px; } .brand b { font: 400 22px/1 "CT Lobster", Georgia, serif; }

/* ----- the gate ----- */
#gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 18px; }
#gate .box { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 26px 24px 24px; }
#gate h1 { font: 400 30px/1.1 "CT Serif", Georgia, serif; color: var(--cream); margin: 18px 0 4px; } #gate p { color: var(--dim); margin: 0 0 16px; }
#gate .or { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .14em; margin: 18px 0; } #gate .or::before, #gate .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
#gate form { display: flex; flex-direction: column; gap: 8px; } #gate label { font: 12.5px/1.2 var(--semi); color: var(--dim); }
#g-google { min-height: 44px; display: flex; justify-content: center; }
.note { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: rgba(255,107,94,.12); border: 1px solid rgba(255,107,94,.4); color: #ffd3ce; font-size: 13.5px; } .note.ok { background: rgba(63,191,143,.12); border-color: rgba(63,191,143,.45); color: #c9f3e2; }

/* ----- fields and buttons ----- */
.in, select.in, textarea.in { width: 100%; min-height: 40px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--deep); color: var(--text); }
.in::placeholder { color: #9a8aab; } select.in { padding-right: 28px; } textarea.in { min-height: 76px; resize: vertical; }
.b { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 6px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font: 13px/1.1 var(--semi); white-space: nowrap; text-decoration: none; }
.b:hover { border-color: #6a5290; } .b.pri { background: var(--berry); border-color: var(--berry); color: #fff; } .b.gold { background: var(--gold); border-color: var(--gold); color: #2a1a2e; } .b.warn { border-color: rgba(255,107,94,.6); color: #ffc2bc; } .b.big { min-height: 44px; font-size: 15px; } .b:disabled { opacity: .5; cursor: default; }
.b.sm { min-height: 30px; padding: 4px 10px; font-size: 12.5px; }

/* ----- the frame ----- */
#app { display: grid; grid-template-columns: 216px 1fr; min-height: 100vh; }
#side { position: sticky; top: 0; align-self: start; height: 100vh; padding: 18px 12px; border-right: 1px solid var(--line); background: var(--deep); display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
#side .who { margin: 4px 8px 16px; } #side .who small { display: block; margin-top: 6px; color: var(--dim); font: 11px/1 var(--semi); letter-spacing: .16em; text-transform: uppercase; }
#tabs { display: flex; flex-direction: column; gap: 2px; }
#tabs button { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 38px; padding: 7px 12px; border: 0; border-radius: 10px; background: none; color: var(--dim); font: 14px/1.1 var(--semi); text-align: left; }
#tabs button:hover { background: var(--panel); color: var(--text); } #tabs button[aria-selected=true] { background: var(--panel2); color: var(--cream); box-shadow: inset 3px 0 0 var(--gold); }
#tabs .n { min-width: 22px; padding: 2px 7px; border-radius: 999px; background: var(--coral); color: #2a1a2e; font: 11.5px/1.3 var(--bold); text-align: center; }
#out { margin-top: auto; }
main { min-width: 0; padding: 22px 26px 60px; }
.top { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; margin-bottom: 16px; }
.top h1 { font: 400 28px/1.1 "CT Serif", Georgia, serif; color: var(--cream); margin-right: auto; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.bar .in { width: auto; min-width: 0; } .bar .q { flex: 1 1 220px; max-width: 360px; } .bar label { display: inline-flex; flex-direction: column; gap: 3px; font: 11px/1 var(--semi); color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; } .seg button { min-height: 36px; padding: 6px 14px; border: 0; background: var(--deep); color: var(--dim); font: 13px/1 var(--semi); } .seg button[aria-pressed=true] { background: var(--gold); color: #2a1a2e; }

/* ----- lists: a grid at desk width, cards on a phone ----- */
.list { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }
.row { display: grid; grid-template-columns: var(--cols); gap: 0 14px; align-items: center; padding: 9px 14px; border-top: 1px solid rgba(67,48,92,.6); min-height: 46px; }
.row.head { border-top: 0; background: var(--deep); min-height: 36px; padding-top: 7px; padding-bottom: 7px; font: 11px/1.2 var(--semi); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.row.go { cursor: pointer; } .row.go:hover { background: var(--panel2); }
.c { min-width: 0; overflow-wrap: anywhere; } .c.num { text-align: right; font-variant-numeric: tabular-nums; } .c.acts { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.c .sub { display: block; color: var(--dim); font-size: 12.5px; } .c b { font: 14px/1.3 var(--semi); color: var(--cream); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
.q-text::before { content: "\201C"; color: var(--dim); } .q-text::after { content: "\201D"; color: var(--dim); }
.tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font: 11.5px/1.5 var(--semi); background: #3a2a52; color: var(--text); white-space: nowrap; }
.tag.ok { background: rgba(63,191,143,.18); color: #9be8c8; } .tag.bad { background: rgba(255,107,94,.18); color: #ffb3ac; } .tag.warn { background: rgba(242,182,50,.18); color: #f7d483; } .tag.off { background: #2c2140; color: var(--dim); }
.empty { padding: 34px 16px; text-align: center; color: var(--dim); }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; color: var(--dim); font-size: 13px; } .pager div { display: flex; gap: 6px; }
.sw { position: relative; width: 46px; height: 26px; border-radius: 999px; border: 1px solid var(--line); background: var(--deep); padding: 0; flex: none; } .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--dim); transition: transform .15s; } .sw[aria-checked=true] { background: var(--leaf); border-color: var(--leaf); } .sw[aria-checked=true]::after { transform: translateX(20px); background: #fff; }
.inl { display: inline-flex; gap: 6px; align-items: center; } .c.acts .inl { flex-wrap: wrap; justify-content: flex-end; } .kv .sub { display: block; color: var(--dim); font-size: 12.5px; } .inl .in { width: 76px; min-height: 32px; padding: 4px 8px; }

/* ----- overview ----- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: 13px/1 var(--semi); } .chip b { font: 14px/1 var(--bold); }
.chip.hot { border-color: rgba(255,107,94,.7); background: rgba(255,107,94,.14); color: #ffd3ce; } .chip.calm b { color: var(--dim); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; } .tile .k { font: 11px/1.2 var(--semi); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); } .tile .v { font: 26px/1.15 var(--bold); color: var(--cream); margin-top: 4px; font-variant-numeric: tabular-nums; } .tile .a { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
.tile.money .v { color: var(--gold); } .tile.margin { background: linear-gradient(135deg, #2f2145, #3a2350); border-color: var(--gold); } .tile.margin .v.neg { color: var(--bad); } .tile.margin .v.pos { color: #8fe6c3; }
.two { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
h2.sec { font: 14px/1.2 var(--semi); color: var(--cream); margin: 0 0 8px; } h2.sec small { color: var(--dim); font: 12.5px/1.2 "CT Sans", system-ui, sans-serif; margin-left: 8px; }

/* ----- the drawer and the dialog ----- */
#shade { position: fixed; inset: 0; background: rgba(8,4,14,.6); z-index: 5; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); border-left: 1px solid var(--line); z-index: 6; overflow-y: auto; padding: 18px 20px 40px; box-shadow: -20px 0 60px rgba(0,0,0,.4); }
#drawer header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; } #drawer header h2 { flex: 1; font: 400 24px/1.15 "CT Serif", Georgia, serif; color: var(--cream); overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 5px 12px; margin: 0 0 14px; } .kv dt { color: var(--dim); font-size: 12.5px; } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.blk { border-top: 1px solid var(--line); padding: 14px 0 4px; } .blk h3 { font: 11px/1.2 var(--semi); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
blockquote { margin: 0 0 8px; padding: 8px 12px; border-left: 3px solid var(--gold); background: var(--deep); border-radius: 0 10px 10px 0; white-space: pre-wrap; overflow-wrap: anywhere; } blockquote small { display: block; color: var(--dim); font: 11px/1.3 var(--semi); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
.mini { width: 100%; border-collapse: collapse; font-size: 13px; } .mini th { text-align: left; font: 11px/1.2 var(--semi); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); padding: 4px 8px 4px 0; } .mini td { padding: 5px 8px 5px 0; border-top: 1px solid rgba(67,48,92,.6); vertical-align: top; overflow-wrap: anywhere; } .mini .num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; } .mini tfoot td { font: 13.5px/1.3 var(--bold); color: var(--cream); }
.lvl { display: inline-block; width: 70px; height: 8px; border-radius: 4px; background: var(--deep); overflow: hidden; vertical-align: middle; margin-right: 6px; } .lvl i { display: block; height: 100%; background: var(--leaf); }
.acts2 { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
#dlg { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; padding: 18px; background: rgba(8,4,14,.66); }
#dlg form { width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
#dlg h2 { font: 400 22px/1.2 "CT Serif", Georgia, serif; color: var(--cream); } #dlg p { margin: 0; color: var(--dim); overflow-wrap: anywhere; } #dlg label { font: 12.5px/1.2 var(--semi); color: var(--dim); margin-bottom: -4px; }
#dlg .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; } #dlg pre { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--deep); white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.5 ui-monospace, Menlo, monospace; max-height: 220px; overflow: auto; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 9; max-width: calc(100% - 24px); padding: 10px 16px; border-radius: 12px; background: var(--cream); color: #2a1a2e; font: 13.5px/1.3 var(--semi); box-shadow: 0 10px 30px rgba(0,0,0,.4); }

@media (max-width: 899px) {
  #app { display: block; }
  #side { position: sticky; z-index: 3; height: auto; flex-direction: row; align-items: center; padding: 8px 10px; border-right: 0; border-bottom: 1px solid var(--line); gap: 8px; overflow: visible; }
  #side .who { margin: 0; flex: none; } #side .who small, #side .who b { display: none; }
  #tabs { flex-direction: row; overflow-x: auto; flex: 1; scrollbar-width: none; gap: 4px; } #tabs::-webkit-scrollbar { display: none; }
  #tabs button { width: auto; white-space: nowrap; min-height: 40px; } #tabs button[aria-selected=true] { box-shadow: inset 0 -3px 0 var(--gold); }
  #out { margin: 0; flex: none; }
  main { padding: 16px 12px 60px; } .top h1 { font-size: 24px; }
  .two { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: 1fr 1fr; gap: 8px; } .tile .v { font-size: 22px; }
  .row.head { display: none; }
  .row { grid-template-columns: 1fr 1fr; gap: 6px 12px; padding: 12px; align-items: start; }
  .row:first-child, .row.head + .row { border-top: 0; }
  .c::before { content: attr(data-h); display: block; font: 10.5px/1.3 var(--semi); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .c.wide, .c.acts { grid-column: 1 / -1; } .c.num { text-align: left; } .c.acts, .c.acts .inl { justify-content: flex-start; } .c.acts::before { display: none; }
  .list.t3 .row { grid-template-columns: 1fr 1fr 1fr; }
  .bar .q { flex-basis: 100%; max-width: none; }
}
</style>
</head>
<body>
<div id="gate" hidden>
  <div class="box">
    <a href="/" style="text-decoration:none">{{brand}}</a>
    <h1>Admin</h1>
    <p id="g-say">Sign in with an admin account, or with the admin password.</p>
    <div id="g-refused" class="note" hidden>That account is not an admin. <button class="b sm" id="g-out" type="button" style="margin-left:6px">Sign out</button></div>
    <div id="g-google-wrap" hidden><div id="g-google"></div><div class="or">or</div></div>
    <form id="g-mail" hidden>
      <label for="g-email">Email me a sign-in link</label>
      <input class="in" id="g-email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <button class="b big" type="submit">Email me a link</button>
      <div class="note ok" id="g-mail-ok" hidden>Check your email. This page moves on by itself once you have clicked the link.</div>
      <div class="or">or</div>
    </form>
    <form id="g-pass">
      <label for="g-pw">Admin password</label>
      <input class="in" id="g-pw" type="password" autocomplete="current-password" required>
      <button class="b pri big" type="submit">Sign in</button>
    </form>
    <div id="g-err" class="note" role="alert" hidden></div>
  </div>
</div>

<div id="app" hidden>
  <nav id="side" aria-label="Admin">
    <a class="who" href="/" style="text-decoration:none">{{brand}}<small>Admin</small></a>
    <div id="tabs" role="tablist"></div>
    <button class="b" id="out" type="button">Sign out</button>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>

<div id="shade" hidden></div>
<aside id="drawer" hidden role="dialog" aria-modal="true" aria-label="Carol"></aside>
<div id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="d-h">
  <form id="d-form">
    <h2 id="d-h"></h2>
    <p id="d-say"></p>
    <div id="d-extra"></div>
    <label for="d-reason" id="d-reason-l">Why? (kept with the action in the record)</label>
    <textarea class="in" id="d-reason" maxlength="300" required></textarea>
    <div id="d-err" class="note" role="alert" hidden></div>
    <pre id="d-out" hidden></pre>
    <div class="btns"><button class="b" type="button" id="d-no">Cancel</button><button class="b pri" type="submit" id="d-yes">Do it</button></div>
  </form>
</div>
<div id="toast" hidden role="status"></div>

<script src="/net.js"></script>
<script src="/admin-ui.js"></script>
</body>
</html>
